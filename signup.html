<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>My account</title>
</head>
<body>
    <main class="signup-page">
        <img src="./logos/logo.svg" alt="Globalgro logo" class="logo signup-logo">

        <div class="signup-form">
            <h1 class="signup-title">My account</h1>

            <label for="name" class="signup-label">Name</label>
            <input id="name" type="text" class="signup-input" value="Jose">

            <label for="email" class="signup-label">Email</label>
            <input id="email" type="email" class="signup-input" value="email@uniboyaca.edu.co">

            <label for="password" class="signup-label">Password</label>
            <input id="password" type="password" class="signup-input" value="************">

            <button type="button" class="primary-button signup-button">Create</button>
        </div>
    </main>
</body>
</html>
