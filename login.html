<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
<!-- Hoja de estilos -->
<link rel="stylesheet" href="styles.css">
<!-- Favicon -->
<link rel="icon" type="image/svg" href="./logos/favicon.svg">
<title>Document</title>
</head>
<body>
    <main class="login-page">
        <img src="./logos/logo.svg" alt="Globalgro logo" class="logo">

        <form class="login-form">
            <label for="email" class="input-label">Email address</label>
            <input id="email" type="email" class="login-input" value="email@uniboyaca.edu.co">

            <label for="password" class="input-label">Password</label>
            <input id="password" type="password" class="login-input" value="************">

            <button type="submit" class="primary-button">Log in</button>
        </form>

        <a href="#" class="forgot-password">Forgot my password</a>

        <button type="button" class="secondary-button">Sign up</button>
    </main>
</body>
</html>
