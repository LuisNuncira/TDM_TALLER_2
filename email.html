<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
<!-- Hoja de estilos -->
<link rel="stylesheet" href="styles.css">
<!-- Favicon -->
<link rel="icon" type="image/svg" href="./logos/favicon.svg">
<title>Document</title>
</head>
<body>
    <main class="email-page">
        <img src="./logos/logo.svg" alt="Globalgro logo" class="logo email-logo">

        <h1 class="email-title">Email has been sent!</h1>

        <p class="email-subtitle">
            Please check your inbox for instructions<br>
            on how to reset the password
        </p>

        <div class="mail-icon-container" aria-label="mail icon">
            <svg class="mail-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
                <rect x="17" y="32" width="86" height="56" rx="4" fill="none" stroke="#E5252E" stroke-width="4"/>
                <path d="M24 38L60 65L96 38" fill="none" stroke="#E5252E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M25 83L46 64" fill="none" stroke="#E5252E" stroke-width="4" stroke-linecap="round"/>
                <path d="M95 83L74 64" fill="none" stroke="#E5252E" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>

        <button type="button" class="email-button">Login</button>

        <p class="resend-text">Didn't receive the email? <a href="#">Resend</a></p>
    </main>
</body>
</html>
